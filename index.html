<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMKARA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7fe; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="simkaraApp" src="https://script.google.com/macros/s/AKfycbzdbDKqNG_L_gPliKXs7xn-lSc95goENBuMOvXgsw4vpLWCNlqJH_CN_askuV-8sErmSA/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    // Dengarkan saat Iframe GAS memberi tahu bahwa dia sudah siap
    window.addEventListener('message', (event) => {
        if (event.data === 'simkara_ready') {
            
            // Cek PWA dengan parameter yang lebih luas (Android & iOS)
            const isPWA = window.matchMedia('(display-mode: standalone)').matches 
                       || window.matchMedia('(display-mode: fullscreen)').matches 
                       || window.matchMedia('(display-mode: minimal-ui)').matches 
                       || window.navigator.standalone;
            
            // Balas tepat ke sumber iframe terdalam
            if (event.source) {
                if (isPWA) {
                    event.source.postMessage('mode_pwa', '*'); // PWA = Tetap Sembunyi
                } else {
                    event.source.postMessage('mode_browser', '*'); // BROWSER = Munculkan Tombol
                }
            }
        }
    });
  </script>
</body>
</html>
