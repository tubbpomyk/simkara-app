<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMKARA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7fe; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="simkaraApp" src="https://script.google.com/macros/s/AKfycbzdbDKqNG_L_gPliKXs7xn-lSc95goENBuMOvXgsw4vpLWCNlqJH_CN_askuV-8sErmSA/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    // Dengarkan pertanyaan dari dalam Iframe (Google Apps Script)
    window.addEventListener('message', (event) => {
        if (event.data === 'apakahIniPWA?') {
            
            // Deteksi apakah sedang dibuka sebagai aplikasi (PWA/Standalone) atau di Browser
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            
            // PENTING: Gunakan event.source agar pesan langsung tembus lapisan terdalam iframe GAS
            if (event.source) {
                if (isStandalone) {
                    // Jika ini PWA, suruh GAS menyembunyikan tombol install-nya
                    event.source.postMessage('iniPWA', '*');
                } else {
                    // Jika ini Browser biasa, suruh GAS menampilkan tombol install-nya
                    event.source.postMessage('tampilkanTombolInstall', '*');
                }
            }
        }
    });
  </script>
</body>
</html>
