<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMKARA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7fe; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Tambahkan id="simkaraIframe" pada iframe -->
  <iframe id="simkaraIframe" src="https://script.google.com/macros/s/AKfycbzdbDKqNG_L_gPliKXs7xn-lSc95goENBuMOvXgsw4vpLWCNlqJH_CN_askuV-8sErmSA/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    // 1. Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    let deferredPrompt;
    const iframe = document.getElementById('simkaraIframe');

    // 2. Tangkap event install dari browser
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Kirim pesan ke dalam iframe (SIMKARA) untuk memunculkan tombol
      // Kita beri delay sedikit agar iframe selesai dimuat
      setTimeout(() => {
        if(iframe.contentWindow) {
          iframe.contentWindow.postMessage('tampilkanTombolInstall', '*');
        }
      }, 3000);
    });

    // 3. Dengarkan perintah dari tombol di dalam iframe (SIMKARA)
    window.addEventListener('message', async (event) => {
      if (event.data === 'picuInstall' && deferredPrompt) {
        // Munculkan pop-up bawaan browser
        deferredPrompt.prompt();
        
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User menginstal aplikasi');
          // Suruh iframe menyembunyikan tombol karena sudah diinstal
          if(iframe.contentWindow) {
            iframe.contentWindow.postMessage('sembunyikanTombolInstall', '*');
          }
        }
        deferredPrompt = null;
      }
    });

    // Jika sudah sukses terinstal, suruh iframe menyembunyikan tombol
    window.addEventListener('appinstalled', () => {
      if(iframe.contentWindow) {
        iframe.contentWindow.postMessage('sembunyikanTombolInstall', '*');
      }
    });
  </script>
</body>
</html>
