<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instal SIMKARA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <!-- Google Fonts untuk desain yang lebih rapi -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Base */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Poppins', sans-serif; background: #f4f7fe; overflow: hidden; }

    /* --- TAMPILAN HALAMAN INSTALASI --- */
    #installUI {
      display: flex; justify-content: center; align-items: center;
      height: 100%; width: 100%; padding: 20px; box-sizing: border-box;
    }
    .card {
      background: white; padding: 40px 30px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.1);
      max-width: 400px; width: 100%; text-align: center;
    }
    .logo {
      width: 100px; height: 100px; margin-bottom: 20px; 
      border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { font-size: 1.5rem; color: #1e3a8a; margin: 0 0 10px 0; }
    p { font-size: 0.95rem; color: #64748b; margin-bottom: 25px; line-height: 1.5; }
    
    .btn-install {
      background: #059669; color: white; border: none; padding: 14px 24px;
      border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
      width: 100%; display: none; align-items: center; justify-content: center;
      transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }
    .btn-install:hover { background: #047857; transform: translateY(-2px); }
    .status-msg { font-size: 0.85rem; color: #ea580c; font-style: italic; margin-top: 15px; }

    /* --- TAMPILAN APLIKASI (SIMKARA) --- */
    #appUI { display: none; width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- TAMPILAN 1: HALAMAN KHUSUS INSTALASI           -->
  <!-- ============================================== -->
  <div id="installUI">
     <div class="card">
        <!-- Logo diambil dari icon-192.png yang ada di folder GitHub Anda -->
        <img src="icon-192.png" alt="Logo SIMKARA" class="logo" onerror="this.style.display='none'">
        <h1>Instal Aplikasi SIMKARA</h1>
        <p>Halaman ini khusus untuk memasang aplikasi SIMKARA ke layar utama (Homescreen) HP Anda agar lebih mudah diakses.</p>
        
        <button id="installBtn" class="btn-install">
           📲 Instal Sekarang
        </button>
        <p id="statusMsg" class="status-msg">Memeriksa dukungan perangkat...</p>
     </div>
  </div>

  <!-- ============================================== -->
  <!-- TAMPILAN 2: APLIKASI SIMKARA (DISEMBUNYIKAN)   -->
  <!-- ============================================== -->
  <div id="appUI">
     <!-- Link langsung ke Google Apps Script Anda -->
     <iframe src="" allow="camera; microphone; geolocation"></iframe>
  </div>

  <script>
    // 1. Cek apakah dibuka sebagai Aplikasi (Homescreen) atau di Browser
    // Jika display-mode standalone aktif, berarti ini dibuka dari HP sebagai aplikasi
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');

    const installUI = document.getElementById('installUI');
    const appUI = document.getElementById('appUI');

    if (isStandalone) {
        // JIKA DIBUKA DARI APLIKASI HOMESCREEN: 
        // Sembunyikan halaman instalasi, tampilkan iFrame SIMKARA
        installUI.style.display = 'none';
        appUI.style.display = 'block';
    } 
    else {
        // JIKA DIBUKA DARI BROWSER (CHROME/SAFARI): 
        // Tampilkan halaman Instalasi.
        
        // Daftarkan Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js');
          });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const statusMsg = document.getElementById('statusMsg');

        // Tangkap trigger instalasi dari Chrome
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          // Hilangkan pesan loading, munculkan tombol hijau
          statusMsg.style.display = 'none';
          installBtn.style.display = 'flex';
        });

        // Aksi saat tombol ditekan
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt(); // Munculkan pop-up bawaan HP
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              console.log('User setuju menginstal');
            }
            deferredPrompt = null;
          }
        });

        // Jika instalasi berhasil
        window.addEventListener('appinstalled', () => {
          installBtn.style.display = 'none';
          statusMsg.style.display = 'block';
          statusMsg.style.color = '#059669';
          statusMsg.style.fontStyle = 'normal';
          statusMsg.style.fontWeight = 'bold';
          statusMsg.innerHTML = '✅ Aplikasi SIMKARA berhasil diinstal!<br><br>Silakan tutup halaman ini dan buka aplikasi SIMKARA dari layar utama (Homescreen) HP Anda.';
        });

        // Pengecekan setelah 3 detik (Bagi iOS / iPhone atau jika sudah diinstal)
        setTimeout(() => {
            if(!deferredPrompt && installBtn.style.display === 'none') {
                statusMsg.innerHTML = 'Aplikasi mungkin sudah terinstal, atau perangkat tidak mendukung instalasi otomatis.<br><br><b>Khusus iPhone/iOS:</b> Ketuk tombol <b>Bagikan (Share)</b> di bawah, lalu pilih menu <b>"Tambah ke Layar Utama" (Add to Home Screen)</b>.';
            }
        }, 3000);
    }
  </script>
</body>
</html>
