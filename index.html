<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMKARA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7fe; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="simkaraApp" src="https://script.google.com/macros/s/AKfycbwfEku2OdGrDv6RwHWx2U6zUSkBQ9hsZvYcEIhoBF0XhsD_ItC6m5N11OdgGBLsfwA6ug/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    // Variabel untuk menyimpan pop-up instalasi dari browser
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e; // Simpan event untuk dipicu nanti
    });

    window.addEventListener('message', (event) => {
        // 1. Pengecekan apakah dibuka di browser atau PWA
        if (event.data === 'simkara_ready') {
            const isPWA = window.matchMedia('(display-mode: standalone)').matches 
                       || window.matchMedia('(display-mode: fullscreen)').matches 
                       || window.navigator.standalone;
            
            if (event.source) {
                if (isPWA) {
                    event.source.postMessage('mode_pwa', '*');
                } else {
                    event.source.postMessage('mode_browser', '*');
                }
            }
        }
        
        // 2. Menerima perintah saat tombol "Install" di sidebar diklik
        else if (event.data === 'picuInstall') {
            if (deferredPrompt) {
                // Munculkan Pop-up bawaan Android/Chrome
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            } else {
                // Jika pop-up otomatis tidak didukung (misal iOS/iPhone)
                // Arahkan ke halaman panduan instalasi manual
                window.location.href = './app.html';
            }
        }
    });
  </script>
</body>
</html>
