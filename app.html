<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMKARA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7fe; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!-- Beri ID pada iframe agar bisa dikontrol oleh script -->
  <iframe id="simkaraApp" src="https://script.google.com/macros/s/AKfycbzdbDKqNG_L_gPliKXs7xn-lSc95goENBuMOvXgsw4vpLWCNlqJH_CN_askuV-8sErmSA/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    // Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    // --- SCRIPT TAMBAHAN UNTUK MENYEMBUNYIKAN TOMBOL ---
    const iframe = document.getElementById('simkaraApp');
    
    function sembunyikanTombol() {
      if (iframe.contentWindow) {
        // Kirim pesan rahasia ke Google Apps Script untuk menyembunyikan tombol
        iframe.contentWindow.postMessage('sembunyikanTombolInstall', '*');
      }
    }

    // Eksekusi pengiriman pesan setelah iFrame memuat halaman
    iframe.onload = () => {
      sembunyikanTombol();
      
      // Kita panggil beberapa kali sebagai cadangan (backup) 
      // untuk memastikan script SIMKARA sudah benar-benar siap menerima pesan
      setTimeout(sembunyikanTombol, 1500);
      setTimeout(sembunyikanTombol, 3000);
    };
  </script>
</body>
</html>
